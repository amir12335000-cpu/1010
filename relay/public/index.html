<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>داشبورد الزهرا</title>
  <style>
    body{font-family:Tahoma,Arial;background:#f3f6fb;color:#172033;margin:0}
    main{max-width:1100px;margin:auto;padding:24px}
    .card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:18px;margin:14px 0}
    input,button{font:inherit;padding:10px 14px;margin:5px;border-radius:8px;border:1px solid #b9c7d8}
    button{background:#173d68;color:white;cursor:pointer;border:none}
    button.danger{background:#a33}
    button.secondary{background:#4a5d78}
    .muted{color:#60728a;font-size:13px;line-height:1.8}
    .row{padding:14px 0;border-top:1px solid #e7edf4}
    .row:first-child{border-top:none}
    .file{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eee;align-items:center}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;margin-right:6px}
    .badge.ok{background:#e7f7ed;color:#1b7a3d}
    .badge.wait{background:#fff4e0;color:#9a6700}
    .badge.off{background:#fde8e8;color:#a11}
    .badge.new{background:#e8f0fe;color:#1a56db}
    .badge.file{background:#f3e8ff;color:#6b21a8}
    h1,h3{margin-top:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
    .stat{background:#f8fafc;border-radius:10px;padding:12px 14px;text-align:center}
    .stat b{display:block;font-size:22px;margin-top:4px}
    .flash{animation:flash 1.2s ease}
    @keyframes flash{0%{background:#fff8d6}100%{background:transparent}}
    .time{font-size:12px;color:#78879a}
    .files-wrap{margin-top:12px;padding:12px;background:#f8fafc;border:1px solid #dce4ef;border-radius:10px}
    .files-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .file-select{display:flex;align-items:center;gap:8px;min-width:0}.file-select input{width:18px;height:18px}.batch-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
    .file-path{direction:ltr;text-align:left;overflow-wrap:anywhere;font-size:12px;color:#42536a}
    .file-actions{display:flex;gap:6px;flex-wrap:wrap}
    .file-count{font-size:12px;color:#60728a}
    .preview-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.78);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
    .preview-panel{background:#fff;border-radius:14px;max-width:min(96vw,1100px);max-height:94vh;padding:12px;display:flex;flex-direction:column;gap:8px}
    .preview-panel img{display:block;max-width:92vw;max-height:82vh;object-fit:contain}
    .preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px}

    .phone-folder{border-top:1px solid #e5eaf1;padding:8px 4px}
    .phone-folder>summary{cursor:pointer;font-weight:700;color:#263b55;list-style:none}
    .phone-folder>summary::-webkit-details-marker{display:none}
    .phone-folder-contents{padding-right:18px;margin-top:6px;border-right:2px solid #dce5ef}
  </style>
</head>
<body>
<main>
  <h1>داشبورد انتقال فایل دانشگاه الزهرا</h1>

  <section class="card" id="login">
    <h3>ورود مدیر</h3>
    <input id="pw" type="password" placeholder="رمز مدیر">
    <button onclick="login()">ورود</button>
  </section>

  <section class="card" id="panel" hidden>
    <div class="grid" id="stats">
      <div class="stat">دستگاه‌ها<b id="statDevices">0</b></div>
      <div class="stat">فایل‌های دریافتی<b id="statTransfers">0</b></div>
    </div>

    <h3 style="margin-top:20px">فعالیت‌های اخیر</h3>
    <div id="activity" class="muted">هنوز فعالیتی ثبت نشده</div>

    <h3 style="margin-top:24px">دستگاه‌ها
      <button class="secondary" onclick="loadDevices()" style="font-size:13px;padding:6px 10px">به‌روزرسانی</button>
    </h3>
    <div id="devices"></div>

    <h3 style="margin-top:24px">انتقال‌ها و آپلودها</h3>
    <div id="transfers"></div>
  </section>

  <p class="muted">
    وقتی دانشجو ثبت‌نام کند یا فایلی بفرستد، همین‌جا نمایش داده می‌شود.
    لیست‌ها هر چند ثانیه به‌صورت خودکار به‌روز می‌شوند.
  </p>
</main>

<script>
let token = '';
let knownDeviceIds = new Set();
let knownTransferIds = new Set();
let firstLoad = true;
const openFileDevices = new Set();
// نگهداری فهرست فایل‌ها بین نوبت‌های تازه‌سازی داشبورد
const fileListCache = new Map();
const selectedFilePaths = new Map();
let transferDisplayLimit = 100;
let devicesLoading = false;
let transfersLoading = false;
let lastDeviceRefresh = 0;
const openFolderPathsByDevice = new Map();
const fileViewOptions = new Map();

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(options.headers || {})
    }
  });
  const text = await res.text();
  let json = {};
  try { json = JSON.parse(text); } catch {}
  if (!res.ok) throw new Error(json.error || text || ('HTTP ' + res.status));
  return json;
}

function fmt(ts) {
  if (!ts) return 'نامشخص';
  try { return new Date(ts).toLocaleString('fa-IR'); } catch { return String(ts); }
}

function addActivity(text, type) {
  const box = document.getElementById('activity');
  if (box.dataset.empty !== '0') {
    box.textContent = '';
    box.dataset.empty = '0';
  }
  const el = document.createElement('div');
  el.className = 'row flash';
  const badge = document.createElement('span');
  badge.className = 'badge ' + (type || 'new');
  badge.textContent = type === 'file' ? 'فایل' : 'ورود';
  el.append(badge, document.createTextNode(' ' + text + ' '));
  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = fmt(Date.now());
  el.append(t);
  box.prepend(el);
  // نگه داشتن حداکثر ۲۰ مورد
  while (box.children.length > 20) box.removeChild(box.lastChild);
}

async function login() {
  token = document.getElementById('pw').value;
  try {
    await api('/api/admin/devices');
    document.getElementById('login').hidden = true;
    document.getElementById('panel').hidden = false;
    sessionStorage.setItem('adm', token);
    await refreshAll();
  } catch (e) {
    alert('ورود ناموفق: ' + e.message);
  }
}

async function loadDevices() {
  if (devicesLoading) return;
  devicesLoading = true;
  try {
    const devices = await api('/api/admin/devices');
    document.getElementById('statDevices').textContent = devices.length;

    const box = document.getElementById('devices');
    box.replaceChildren();

    // جدیدها را پیدا کن
    for (const d of devices) {
      if (!firstLoad && !knownDeviceIds.has(d.deviceId)) {
        addActivity(d.firstName + ' ' + d.lastName + ' (' + d.major + ') وارد شد', 'new');
      }
      knownDeviceIds.add(d.deviceId);
    }

    // جدیدترین‌ها بالا
    devices.sort((a, b) => (b.pairedAt || 0) - (a.pairedAt || 0));

    for (const d of devices) {
      const el = document.createElement('div');
      el.className = 'row';
      el.dataset.deviceId = d.deviceId;

      const title = document.createElement('div');
      const name = document.createElement('b');
      name.textContent = (d.firstName || '') + ' ' + (d.lastName || '');
      title.append(name);

      const badge = document.createElement('span');
      if (d.revoked) {
        badge.className = 'badge off';
        badge.textContent = 'لغوشده';
      } else if (d.approved) {
        badge.className = 'badge ok';
        badge.textContent = 'فعال';
      } else {
        badge.className = 'badge wait';
        badge.textContent = 'در انتظار تأیید';
      }
      title.append(document.createTextNode(' '), badge);
      el.append(title);

      const info = document.createElement('div');
      info.className = 'muted';
      info.innerHTML =
        'رشته: ' + (d.major || '-') +
        ' | ثبت‌نام: ' + fmt(d.pairedAt) +
        ' | آخرین ارتباط: ' + fmt(d.lastSeen) +
        (d.lastUploadName ? (' | آخرین فایل: ' + d.lastUploadName + ' (' + fmt(d.lastUploadAt) + ')') : '');
      el.append(info);

      const actions = document.createElement('div');
      actions.style.marginTop = '8px';

      if (!d.approved && !d.revoked) {
        const b = document.createElement('button');
        b.textContent = 'تأیید دستگاه';
        b.onclick = async () => {
          await api('/api/admin/devices/' + encodeURIComponent(d.deviceId) + '/approve', { method: 'POST', body: '{}' });
          loadDevices();
        };
        actions.append(b);
      }

      if (d.approved && !d.revoked) {
        const s = document.createElement('button');
        s.className = 'secondary';
        s.textContent = 'نمایش فایل‌های گوشی';
        s.onclick = async () => {
          try {
            openFileDevices.add(d.deviceId);
            s.disabled = true; s.textContent = 'در حال اسکن...';
            const before = Number(d.filesUpdatedAt || 0);
            await api('/api/admin/devices/' + encodeURIComponent(d.deviceId) + '/scan', { method: 'POST', body: '{}' });
            await waitForFileList(d.deviceId, el, before);
          } catch (e) { alert('خطا در اسکن فایل‌ها: ' + e.message); }
          finally { s.disabled = false; s.textContent = 'نمایش فایل‌های گوشی'; }
        };
        actions.append(s);

        const rv = document.createElement('button');
        rv.className = 'danger';
        rv.textContent = 'لغو دستگاه';
        rv.onclick = async () => {
          if (!confirm('دستگاه لغو شود؟')) return;
          await api('/api/admin/devices/' + encodeURIComponent(d.deviceId) + '/revoke', { method: 'POST', body: '{}' });
          loadDevices();
        };
        actions.append(rv);
      }

      el.append(actions);
      box.append(el);
      if (openFileDevices.has(d.deviceId)) {
        const cached = fileListCache.get(d.deviceId);
        if (cached) renderFiles(d.deviceId, el, cached);
        else showFiles(d.deviceId, el);
      }
    }
  } catch (e) {
    console.error(e);
  } finally {
    devicesLoading = false;
    lastDeviceRefresh = Date.now();
  }
}

function currentDeviceElement(id, fallback) {
  // loadDevices هر چند ثانیه کارت‌ها را از نو می‌سازد؛ همیشه کارت فعلی را پیدا کن.
  const current = [...document.querySelectorAll('#devices [data-device-id]')]
    .find(node => node.dataset.deviceId === id);
  return current || (fallback && fallback.isConnected ? fallback : null);
}

async function waitForFileList(id, el, previousUpdatedAt) {
  const deadline = Date.now() + 90000;
  let latest = fileListCache.get(id) || null;
  while (Date.now() < deadline) {
    latest = await api('/api/admin/devices/' + encodeURIComponent(id) + '/files');
    fileListCache.set(id, latest);
    const target = currentDeviceElement(id, el);
    if (target) renderFiles(id, target, latest);
    if (latest.updatedAt && Number(latest.updatedAt) > Number(previousUpdatedAt || 0)) {
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
  if (latest) {
    fileListCache.set(id, latest);
    const target = currentDeviceElement(id, el);
    if (target) renderFiles(id, target, latest);
  }
  throw new Error('پاسخ اسکن از گوشی دریافت نشد؛ اتصال گوشی به سرور و فعال بودن سرویس را بررسی کن.');
}

async function showFiles(id, el) {
  try {
    const j = await api('/api/admin/devices/' + encodeURIComponent(id) + '/files');
    fileListCache.set(id, j);
    const target = currentDeviceElement(id, el);
    if (target) renderFiles(id, target, j);
  } catch (e) { console.error('showFiles:', e); }
}

async function previewPhoneImage(deviceId, file, button) {
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = 'در حال دریافت تصویر...';
  try {
    const queued = await api('/api/admin/devices/' + encodeURIComponent(deviceId) + '/transfers', {
      method: 'POST', body: JSON.stringify({ path: file.path })
    });
    const transferId = queued.transferId;
    if (!transferId) throw new Error('شناسه انتقال دریافت نشد');
    let transfer = null;
    const deadline = Date.now() + 180000;
    while (Date.now() < deadline) {
      const items = await api('/api/admin/transfers');
      transfer = items.find(x => x.id === transferId);
      if (transfer && ['complete', 'failed', 'cancelled'].includes(transfer.status)) break;
      button.textContent = 'در حال دریافت تصویر...';
      await new Promise(resolve => setTimeout(resolve, 1800));
    }
    if (!transfer || transfer.status !== 'complete') {
      throw new Error(transfer?.status === 'cancelled' ? 'انتقال لغو شد' : 'دریافت تصویر در زمان مجاز کامل نشد');
    }
    button.textContent = 'در حال آماده‌سازی پیش‌نمایش...';
    const ticket = await api('/api/admin/transfers/' + encodeURIComponent(transferId) + '/preview-ticket', {
      method: 'POST', body: '{}'
    });
    if (!ticket.ticket) throw new Error('لینک پیش‌نمایش معتبر نیست');
    const backdrop = document.createElement('div');
    backdrop.className = 'preview-backdrop';
    const panel = document.createElement('div');
    panel.className = 'preview-panel';
    const head = document.createElement('div');
    head.className = 'preview-head';
    const name = document.createElement('strong');
    name.textContent = file.name || transfer.name || 'پیش‌نمایش تصویر';
    const close = document.createElement('button');
    close.className = 'secondary';
    close.textContent = 'بستن';
    close.onclick = () => backdrop.remove();
    const img = document.createElement('img');
    img.alt = name.textContent;
    img.src = '/api/admin/transfers/' + encodeURIComponent(transferId) +
      '/preview?ticket=' + encodeURIComponent(ticket.ticket);
    img.onerror = () => { img.alt = 'نمایش تصویر ممکن نیست؛ ممکن است قالب تصویر پشتیبانی نشود.'; };
    head.append(name, close);
    panel.append(head, img);
    backdrop.append(panel);
    backdrop.addEventListener('click', event => { if (event.target === backdrop) backdrop.remove(); });
    document.body.append(backdrop);
  } catch (e) {
    alert('پیش‌نمایش انجام نشد: ' + e.message);
  } finally {
    button.disabled = false;
    button.textContent = originalText;
    await loadTransfers();
  }
}

function renderFiles(id, el, j) {
  if (!el || !el.isConnected) return;
  fileListCache.set(id, j);
  let wrap = el.querySelector('.files-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'files-wrap'; el.append(wrap); }
  // وضعیت پوشه‌های باز و موقعیت اسکرول را هنگام بازسازی فهرست حفظ کن.
  const previousOpenFolders = openFolderPathsByDevice.get(id) || new Set();
  const previousScrollTop = wrap.scrollTop;
  wrap.replaceChildren();

  const allFiles = (Array.isArray(j.files) ? j.files : []).map(f => {
    const pathValue = String(f?.path ?? f?.[' path'] ?? '').replace(/\\/g, '/').trim().replace(/\s*\/\s*/g, '/').replace(/\/{2,}/g, '/');
    return { ...f, path: pathValue, name: String(f?.name ?? f?.[' name'] ?? '').trim() };
  }).filter(f => f.path);
  const allFolders = (Array.isArray(j.folders) ? j.folders : []).map(f => {
    const pathValue = String(f?.path ?? '').replace(/\\/g, '/').trim().replace(/\s*\/\s*/g, '/').replace(/\/{2,}/g, '/');
    return { ...f, path: pathValue, name: String(f?.name ?? '').trim() };
  }).filter(f => f.path);
  const base = '/storage/emulated/0/';
  const allVisibleFiles = allFiles.filter(f => String(f.path).replace(/\\/g, '/').startsWith(base));
  const visibleFolders = allFolders.filter(f => String(f.path).replace(/\\/g, '/').startsWith(base));
  const view = fileViewOptions.get(id) || { query: '', category: 'all', sort: 'name' };
  const categoryOf = name => {
    const ext = String(name).split('.').pop().toLowerCase();
    if (/^(jpg|jpeg|png|gif|webp|bmp|heic|svg)$/.test(ext)) return 'image';
    if (/^(mp4|mkv|avi|mov|webm|3gp|m4v)$/.test(ext)) return 'video';
    if (/^(mp3|wav|m4a|aac|ogg|flac|opus)$/.test(ext)) return 'audio';
    if (/^(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|rtf|odt|ods)$/.test(ext)) return 'document';
    if (/^(zip|rar|7z|tar|gz|bz2)$/.test(ext)) return 'archive';
    return 'other';
  };
  let visibleFiles = allVisibleFiles.filter(f => {
    const matchesQuery = !view.query || (f.name + ' ' + f.path).toLocaleLowerCase().includes(view.query.toLocaleLowerCase());
    return matchesQuery && (view.category === 'all' || categoryOf(f.name) === view.category);
  });
  visibleFiles.sort((a, b) => view.sort === 'size' ? Number(b.size || 0) - Number(a.size || 0) : view.sort === 'date' ? Number(b.modified || 0) - Number(a.modified || 0) : a.name.localeCompare(b.name, 'fa'));

  const toolbar = document.createElement('div'); toolbar.className = 'files-toolbar';
  const count = document.createElement('span'); count.className = 'file-count';
  count.textContent = `${visibleFiles.length.toLocaleString('fa-IR')} فایل و ${visibleFolders.length.toLocaleString('fa-IR')} پوشه | آخرین اسکن: ${fmt(j.updatedAt)}`;
  const close = document.createElement('button'); close.className = 'secondary'; close.textContent = 'بستن فهرست';
  close.onclick = () => { openFileDevices.delete(id); fileListCache.delete(id); wrap.remove(); };
  toolbar.append(count, close); wrap.append(toolbar);
  const filterBar = document.createElement('div'); filterBar.className = 'files-toolbar';
  const searchInput = document.createElement('input'); searchInput.type = 'search'; searchInput.placeholder = 'جست‌وجوی نام یا مسیر فایل'; searchInput.value = view.query; searchInput.style.flex = '1'; searchInput.style.minWidth = '180px';
  const categorySelect = document.createElement('select');
  [['all','همه فایل‌ها'],['image','تصاویر'],['video','ویدئوها'],['document','اسناد'],['audio','صوتی'],['archive','فشرده'],['other','سایر فایل‌ها']].forEach(([value,label]) => { const option = document.createElement('option'); option.value = value; option.textContent = label; categorySelect.append(option); });
  categorySelect.value = view.category;
  const sortSelect = document.createElement('select');
  [['name','مرتب‌سازی: نام'],['date','جدیدترین'],['size','بزرگ‌ترین']].forEach(([value,label]) => { const option = document.createElement('option'); option.value = value; option.textContent = label; sortSelect.append(option); });
  sortSelect.value = view.sort;
  const applyView = () => { fileViewOptions.set(id, { query: searchInput.value, category: categorySelect.value, sort: sortSelect.value }); renderFiles(id, el, j); };
  searchInput.addEventListener('input', () => { clearTimeout(searchInput._refresh); searchInput._refresh = setTimeout(applyView, 250); });
  categorySelect.onchange = applyView; sortSelect.onchange = applyView;
  filterBar.append(searchInput, categorySelect, sortSelect); wrap.append(filterBar);
  const selected = selectedFilePaths.get(id) || new Set();
  selectedFilePaths.set(id, selected);
  const batchBar = document.createElement('div'); batchBar.className = 'batch-actions';
  const selectedCount = document.createElement('span'); selectedCount.className = 'muted';
  const batchBtn = document.createElement('button'); batchBtn.textContent = 'انتقال فایل‌های انتخاب‌شده';
  const selectAll = document.createElement('button'); selectAll.className = 'secondary'; selectAll.textContent = 'انتخاب همه فایل‌ها';
  function updateBatchBar() { selectedCount.textContent = `${selected.size} فایل انتخاب شده`; batchBtn.disabled = selected.size === 0; }
  selectAll.onclick = () => { if (selected.size === visibleFiles.length) selected.clear(); else visibleFiles.forEach(f => selected.add(f.path)); renderFiles(id, el, j); };
  batchBtn.onclick = async () => {
    if (!selected.size) return;
    batchBtn.disabled = true; batchBtn.textContent = 'در حال ثبت انتقال‌ها...';
    try {
      const result = await api('/api/admin/devices/' + encodeURIComponent(id) + '/transfers/batch', { method: 'POST', body: JSON.stringify({ paths: [...selected] }) });
      selected.clear();
      alert(`${result.count} فایل برای انتقال به گوشی ارسال شد. پس از تکمیل، در بخش انتقال‌ها دانلودشان کن.`);
      await loadTransfers(); updateBatchBar();
    } catch (e) { alert('خطا در انتقال گروهی: ' + e.message); batchBtn.disabled = false; batchBtn.textContent = 'انتقال فایل‌های انتخاب‌شده'; }
  };
  batchBar.append(selectAll, batchBtn, selectedCount); wrap.append(batchBar); updateBatchBar();

  if (!visibleFiles.length && !visibleFolders.length) {
    const empty = document.createElement('div'); empty.className = 'muted';
    empty.textContent = 'فایل یا پوشه قابل‌دسترسی در حافظه اشتراکی گوشی پیدا نشد.';
    wrap.append(empty); return;
  }

  // Build a complete folder tree, including empty folders, then add files at their actual paths.
  const tree = new Map();
  function ensureFolder(parts) {
    let node = tree;
    for (const part of parts) {
      if (!node.has(part) || !(node.get(part) instanceof Map)) node.set(part, new Map());
      node = node.get(part);
    }
    return node;
  }
  for (const folder of visibleFolders) {
    const relative = String(folder.path).replace(/\\/g, '/').slice(base.length);
    const parts = relative.split('/').filter(Boolean);
    if (parts.length) ensureFolder(parts);
  }
  for (const f of visibleFiles) {
    const relative = String(f.path).replace(/\\/g, '/').slice(base.length);
    const parts = relative.split('/').filter(Boolean);
    if (!parts.length) continue;
    const name = parts.pop();
    const parent = ensureFolder(parts);
    parent.set(name, { __file: f });
  }

  function makeFileRow(container, name, f) {
    const row = document.createElement('div'); row.className = 'file';
    const label = document.createElement('div'); label.className = 'file-path';
    label.textContent = `📄 ${name} (${Number(f.size || 0).toLocaleString('fa-IR')} بایت)`;
    const actions = document.createElement('div'); actions.className = 'file-actions';
    const selector = document.createElement('label'); selector.className = 'file-select';
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = selected.has(f.path);
    checkbox.onchange = () => { if (checkbox.checked) selected.add(f.path); else selected.delete(f.path); updateBatchBar(); };
    selector.append(checkbox); actions.append(selector);
    const btn = document.createElement('button'); btn.textContent = 'دریافت فایل';
    btn.onclick = async () => {
      try {
        await api('/api/admin/devices/' + encodeURIComponent(id) + '/transfers', { method: 'POST', body: JSON.stringify({ path: f.path }) });
        alert('درخواست دریافت فایل به گوشی ارسال شد. پس از تکمیل، در بخش انتقال‌ها قابل دانلود است.');
        await loadTransfers();
      } catch (e) { alert('خطا: ' + e.message); }
    };
    actions.append(btn);
    if (/\.(jpe?g|png|gif|webp|bmp)$/i.test(name)) {
      const preview = document.createElement('button');
      preview.className = 'secondary';
      preview.textContent = 'پیش‌نمایش';
      preview.onclick = () => previewPhoneImage(id, f, preview);
      actions.append(preview);
    }
    row.append(label, actions); container.append(row);
  }

  // ساخت تدریجی درخت: زیرپوشه‌ها فقط هنگام باز شدن ساخته می‌شوند
  // و در هر پوشه حداکثر ۱۰۰ مورد در هر مرحله به DOM اضافه می‌شود.
  function renderTree(container, nodes, depth = 0, parentPath = '') {
    const entries = [...nodes.entries()].sort((a, b) => {
      const aFolder = a[1] instanceof Map, bFolder = b[1] instanceof Map;
      if (aFolder !== bFolder) return aFolder ? -1 : 1;
      return a[0].localeCompare(b[0], 'fa');
    });
    let cursor = 0;
    const renderNext = () => {
      const stop = Math.min(cursor + 100, entries.length);
      while (cursor < stop) {
        const [name, value] = entries[cursor++];
        if (value instanceof Map) {
          const details = document.createElement('details');
          details.className = 'phone-folder';
          const folderKey = parentPath ? parentPath + '/' + name : name;
          details.dataset.folderKey = folderKey;
          details.open = previousOpenFolders.has(folderKey);
          const summary = document.createElement('summary');
          summary.textContent = '📁 ' + name;
          const inner = document.createElement('div');
          inner.className = 'phone-folder-contents';
          details.append(summary, inner);
          details.addEventListener('toggle', () => {
            if (details.open) previousOpenFolders.add(folderKey);
            else previousOpenFolders.delete(folderKey);
            openFolderPathsByDevice.set(id, previousOpenFolders);
            if (details.open && details.dataset.loaded !== '1') {
              details.dataset.loaded = '1';
              renderTree(inner, value, depth + 1, folderKey);
            }
          });
          if (details.open) {
            details.dataset.loaded = '1';
            renderTree(inner, value, depth + 1, folderKey);
          }
          container.append(details);
        } else if (value && value.__file) {
          makeFileRow(container, name, value.__file);
        }
      }
      const oldMore = container.querySelector(':scope > .file-more');
      if (oldMore) oldMore.remove();
      if (cursor < entries.length) {
        const more = document.createElement('button');
        more.className = 'secondary file-more';
        more.textContent = `نمایش ۱۰۰ مورد بعدی (${entries.length - cursor} مورد باقی‌مانده)`;
        more.onclick = () => { more.remove(); renderNext(); };
        container.append(more);
      }
    };
    renderNext();
  }
  renderTree(wrap, tree);
  wrap.scrollTop = previousScrollTop;
}

async function loadTransfers() {
  if (transfersLoading) return;
  transfersLoading = true;
  try {
    const transfers = await api('/api/admin/transfers');
    document.getElementById('statTransfers').textContent = transfers.length;

    const box = document.getElementById('transfers');
    box.replaceChildren();

    // جدیدها
    for (const t of transfers) {
      if (!firstLoad && !knownTransferIds.has(t.id) && t.status === 'complete') {
        const who = t.studentName || t.deviceId || 'ناشناس';
        addActivity(who + ' → ' + (t.name || t.relativePath || 'فایل'), 'file');
      }
      knownTransferIds.add(t.id);
    }

    // جدیدترین بالا
    transfers.sort((a, b) => (b.completedAt || b.createdAt || 0) - (a.completedAt || a.createdAt || 0));

    if (!transfers.length) {
      const empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = 'هنوز فایلی دریافت نشده است.';
      box.append(empty);
      return;
    }

    for (const t of transfers.slice(0, transferDisplayLimit)) {
      const p = document.createElement('div');
      p.className = 'row';

      const title = document.createElement('div');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (t.status === 'complete' ? 'ok' : (t.status === 'cancelled' ? 'off' : 'wait'));
      const statusLabels = {
        queued: 'در صف ارسال به گوشی',
        delivered: 'گوشی دستور را دریافت کرد؛ در حال آماده‌سازی فایل',
        complete: 'آماده دانلود',
        cancelled: 'لغو شد',
        failed: 'انتقال ناموفق'
      };
      badge.textContent = statusLabels[t.status] || 'در حال پردازش';
      title.append(badge);
      title.append(document.createTextNode(' ' + (t.name || t.relativePath || t.id)));
      p.append(title);

      const meta = document.createElement('div');
      meta.className = 'muted';
      meta.textContent =
        (t.studentName ? ('دانشجو: ' + t.studentName + ' | ') : '') +
        (t.relativePath ? ('مسیر: ' + t.relativePath + ' | ') : '') +
        'زمان: ' + fmt(t.completedAt || t.createdAt);
      p.append(meta);

      const actions = document.createElement('div');
      actions.style.marginTop = '6px';

      if (['queued', 'delivered'].includes(t.status)) {
        const c = document.createElement('button');
        c.className = 'danger';
        c.textContent = 'لغو انتقال';
        c.onclick = async () => {
          try {
            await api('/api/admin/transfers/' + encodeURIComponent(t.id) + '/cancel', { method: 'POST', body: '{}' });
            loadTransfers();
          } catch (e) { alert(e.message); }
        };
        actions.append(c);
      }

      if (t.status === 'complete') {
        const b = document.createElement('button');
        b.textContent = 'دانلود';
        b.onclick = async () => {
          // پنجره را هم‌زمان با کلیک کاربر باز می‌کنیم تا مرورگر دانلود را مسدود نکند.
          const downloadWindow = window.open('about:blank', '_blank');
          b.disabled = true;
          const originalText = b.textContent;
          b.textContent = 'آماده‌سازی دانلود...';
          try {
            const ticketResponse = await fetch('/api/admin/transfers/' + encodeURIComponent(t.id) + '/download-ticket', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token }
            });
            if (!ticketResponse.ok) {
              const message = await ticketResponse.text();
              throw new Error(message || 'ساخت لینک دانلود ناموفق بود');
            }
            const data = await ticketResponse.json();
            if (!data.ticket) throw new Error('لینک دانلود معتبر دریافت نشد');
            const downloadUrl = '/api/admin/transfers/' + encodeURIComponent(t.id) +
              '/download?ticket=' + encodeURIComponent(data.ticket);
            if (downloadWindow && !downloadWindow.closed) {
              downloadWindow.location.href = downloadUrl;
            } else {
              const link = document.createElement('a');
              link.href = downloadUrl;
              link.download = t.name || 'file.bin';
              link.rel = 'noopener';
              document.body.appendChild(link);
              link.click();
              link.remove();
            }
          } catch (e) {
            if (downloadWindow && !downloadWindow.closed) downloadWindow.close();
            alert('دانلود انجام نشد: ' + e.message);
          } finally {
            b.disabled = false;
            b.textContent = originalText;
          }
        };
        actions.append(b);
      }

      p.append(actions);
      box.append(p);
    }
    if (transfers.length > transferDisplayLimit) {
      const more = document.createElement('button');
      more.className = 'secondary';
      more.textContent = `نمایش ۱۰۰ انتقال بعدی (${transfers.length - transferDisplayLimit} مورد باقی‌مانده)`;
      more.onclick = () => { transferDisplayLimit += 100; loadTransfers(); };
      box.append(more);
    }
  } catch (e) {
    console.error(e);
  } finally {
    transfersLoading = false;
  }
}

async function refreshAll() {
  if (!lastDeviceRefresh || Date.now() - lastDeviceRefresh >= 30000) {
    await loadDevices();
  }
  await loadTransfers();
  firstLoad = false;
}

window.onload = () => {
  const t = sessionStorage.getItem('adm');
  if (t) {
    token = t;
    document.getElementById('pw').value = t;
    login();
  }
};

// وضعیت انتقال‌ها سریع بررسی می‌شود؛ درخواست هم‌زمان تکراری ایجاد نمی‌شود.
setInterval(() => {
  if (token) loadTransfers();
}, 2500);

// اطلاعات دستگاه‌ها جداگانه و با فاصله بیشتر به‌روز می‌شود.
setInterval(() => {
  if (token && Date.now() - lastDeviceRefresh >= 30000) loadDevices();
}, 30000);
</script>
